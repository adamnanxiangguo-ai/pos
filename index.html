<title>词性</title>
<style>
:root{
  --bg:#12191c; --surface:#1d272b; --line:#2b393f;
  --text:#eceff0; --dim:#7b8b91;
  --pick:#d9a441; --pick-ink:#12191c;
  --right:#4fa8a0; --wrong:#c9605a;
  --rev:#6ba3c4;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#e7ebe8; --surface:#f6f8f6; --line:#ccd4d0;
    --text:#16201f; --dim:#6d7b78;
    --pick:#9a6b12; --pick-ink:#fdfaf3;
    --right:#1f6f68; --wrong:#a63f39;
    --rev:#2f6b8c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
#app{
  height:100dvh; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
  max-width:620px; margin:0 auto;
}

/* ---- status ---- */
.status{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.status b{font-weight:600;color:var(--pick)}
.status .due b{color:var(--rev)}
.status .due.zero b{color:var(--dim)}

/* ---- stage ---- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
.mode{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--rev); height:13px; font-weight:600;
}
.mode.hide{visibility:hidden}
.word{
  font-family:Georgia,"Iowan Old Style",ui-serif,serif;
  font-size:clamp(2rem,9vw,3.4rem); font-weight:400;
  letter-spacing:-.02em; line-height:1.05; text-align:center;
  word-break:break-word; padding:0 4px;
}
.say{
  width:50px;height:50px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);
  color:var(--dim);font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.say:active{background:var(--line)}

/* ---- reveal panel ---- */
.panel{
  width:100%; min-height:74px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  padding:10px 14px; border-radius:11px;
  border:1px dashed transparent; background:transparent;
}
.panel.on{border-color:var(--line);background:var(--surface)}
.panel .tags{
  font-family:Georgia,ui-serif,serif;font-style:italic;
  font-size:1.15rem;color:var(--rev);letter-spacing:.06em;
}
.panel .cn{font-size:1rem;line-height:1.5;text-align:center;color:var(--text)}
.panel.off *{display:none}

/* ---- choices ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.pos{
  position:relative;min-height:70px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--text);
  font-family:Georgia,ui-serif,serif;font-style:italic;font-size:1.6rem;
}
.pos:active{background:var(--line)}
.pos[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.pos.hit{background:var(--right);border-color:var(--right);color:var(--pick-ink)}
.pos.miss{background:transparent;border-color:var(--right);border-style:dashed;color:var(--right)}
.pos.bad{background:transparent;border-color:var(--wrong);color:var(--wrong);text-decoration:line-through;text-decoration-thickness:1.5px}
.pos.off{opacity:.32}
.mark{position:absolute;top:6px;right:9px;font-family:system-ui,sans-serif;font-style:normal;font-size:10px;font-weight:600;letter-spacing:.1em}
.key{position:absolute;bottom:6px;left:9px;font-family:system-ui,sans-serif;font-style:normal;font-size:9px;color:var(--dim);opacity:.55}
.pos[aria-pressed="true"] .key{color:var(--pick-ink);opacity:.6}

/* ---- actions ---- */
.act{width:100%;min-height:56px;border-radius:13px;border:none;background:var(--text);color:var(--bg);font-size:1rem;font-weight:600;letter-spacing:.16em}
.act:disabled{background:var(--surface);color:var(--dim);border:1.5px solid var(--line)}
.act.next{background:var(--wrong);color:#fff}

.row{display:flex;gap:9px;margin-top:9px}
.mini{
  flex:1;min-height:42px;border-radius:10px;
  border:1px solid var(--line);background:transparent;color:var(--dim);
  font-size:.8rem;letter-spacing:.08em;
}
.mini:active{background:var(--surface)}
.mini.armed{border-color:var(--wrong);color:var(--wrong)}
.mini.on{border-color:var(--rev);color:var(--rev)}

.foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--dim);margin-top:10px;letter-spacing:.05em;gap:10px}
.foot u{cursor:pointer}
.note{color:var(--rev);flex:1;text-align:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---- sync sheet ---- */
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;z-index:9;
}
.sheet.on{display:flex}
.card{
  width:100%;max-width:620px;max-height:88dvh;overflow-y:auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.shead b{font-size:1rem;letter-spacing:.1em}
.x{font-size:18px;color:var(--dim);padding:4px 8px}
.sec{padding:16px 0;border-top:1px solid var(--line);margin-top:10px}
.lbl{font-size:.9rem;font-weight:600;margin-bottom:5px}
.sub{font-size:.75rem;color:var(--dim);line-height:1.5;margin-bottom:9px}
.sheet textarea{
  width:100%;height:88px;resize:none;
  background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:9px;padding:9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.45;
  word-break:break-all;-webkit-user-select:text;user-select:text;
}
.btn{
  width:100%;min-height:44px;margin-top:9px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-size:.88rem;letter-spacing:.08em;
}
.btn:active{background:var(--line)}
.warn{font-size:.75rem;color:var(--pick);line-height:1.5;margin-top:9px}

/* ---- phone ---- */
@media (max-width:560px){
  #app{padding-left:12px;padding-right:12px}
  .status{font-size:10px;letter-spacing:.08em}
  .stage{gap:12px}
  .say{width:46px;height:46px;font-size:17px}
  .panel{min-height:66px;padding:9px 12px}
  .panel .cn{font-size:.95rem}
  .pos{min-height:82px;font-size:1.75rem}    /* 拇指区，按钮要更大 */
  .act{min-height:62px}
  .mini{min-height:48px}
  .key{display:none}                          /* 手机没键盘 */
  .foot{font-size:11px;margin-top:12px}
}
</style>
</head>
<body>
<div id="app">
  <div class="status">
    <div class="due zero">复习 <b id="due">0</b></div>
    <div>纠缠 <b id="nest">0</b></div>
    <div>本轮 <b id="seen">0</b>/<span id="total">0</span></div>
  </div>

  <div class="stage">
    <div class="mode hide" id="mode">复习中</div>
    <div class="word" id="word">…</div>
    <button class="say" id="say" aria-label="发音">🔊</button>
    <div class="panel off" id="panel">
      <div class="tags" id="ptags"></div>
      <div class="cn" id="pcn"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <button class="act" id="act" disabled>提交</button>

  <div class="row">
    <button class="mini" id="reveal">揭示 <span style="opacity:.5">R</span></button>
    <button class="mini" id="finish">今天到此为止</button>
  </div>

  <div class="foot">
    <u id="sync">同步</u>
    <span class="note" id="note"></span>
    <u id="exp">下载备份</u>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="card">
    <div class="shead">
      <b>同步</b>
      <button class="x" id="close">✕</button>
    </div>

    <div class="sec">
      <div class="lbl">把这台的进度带走</div>
      <div class="sub" id="mystat">—</div>
      <textarea id="out" readonly></textarea>
      <button class="btn" id="copy">复制同步码</button>
    </div>

    <div class="sec">
      <div class="lbl">合并另一台的进度</div>
      <div class="sub">粘贴另一台的同步码，两边数据会合并，不会互相覆盖</div>
      <textarea id="in" placeholder="在这里粘贴同步码"></textarea>
      <button class="btn" id="merge">合并</button>
      <div class="warn" id="warn"></div>
    </div>
  </div>
</div>

ferent","p":["adj"],"cn":"冷漠的；不关心的"},{"w":"infer","p":["v"],"cn":"推断；推论"},{"w":"confine","p":["v"],"cn":"限制；使局限于"}];
const POS = ['n','v','adj','adv'];
const KEY = 'pos-drill-v2';
const GAP = [2, 4];           // 过第1站→+2天(1→3)，过第2站→+4天(3→7)，过第3站→毕业

/* ---------- 北京日期 ---------- */
const bj = (off=0) => new Date(Date.now() + 8*3600e3 + off*864e5).toISOString().slice(0,10);

/* ---------- state ---------- */
let S = { meta:{}, queue:[], nest:{}, round:0, pool:[], poolDate:'', srs:{} };
try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S, JSON.parse(r)); }catch(e){}
if(!S.round) S.round = Date.now();

const idx={}; WORDS.forEach((x,i)=>idx[x.w]=i);
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const lastOf = w => S.meta[w] || 0;
const rnd = (a,b) => a + ((Math.random()*(b-a+1))|0);
const shuf = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

// 跨天且未结算 → 按约定丢弃（不自动兜底）
if(S.poolDate && S.poolDate !== bj()){ S.pool=[]; S.poolDate=bj(); }
if(!S.poolDate) S.poolDate = bj();

/* ---------- 复习队列 ---------- */
let rq = [];                       // 今日待复习（含过期补做）
const judged = new Set();          // 本次会话已裁决过的复习词，不重复裁决
function buildRQ(){
  const t = bj();
  rq = shuf(Object.keys(S.srs).filter(w => idx[w]!==undefined && S.srs[w].due <= t));
}
buildRQ();

/* ---------- 日常队列 ---------- */
function refill(){
  if(S.queue.length>=20) return;
  const inQ=new Set(S.queue);
  const pool=WORDS.filter(x=>!inQ.has(x.w));
  if(!pool.length) return;
  let head=pool.filter(x=>!lastOf(x.w));           // 没见过的绝对优先
  if(!head.length){
    pool.sort((a,b)=>lastOf(a.w)-lastOf(b.w));
    head=pool.slice(0, Math.max(40, Math.ceil(pool.length/12)));
  }
  shuf(head);
  for(const x of head){ if(S.queue.length>=20) break; S.queue.push(x.w); }
}
const insertQ = (w,g) => S.queue.splice(Math.min(g,S.queue.length),0,w);
const insertR = (w,g) => rq.splice(Math.min(g,rq.length),0,w);

function seenCount(){ let n=0; for(const w in S.meta) if(S.meta[w]>=S.round) n++; return n; }
function tickRound(){ if(seenCount()>=WORDS.length) S.round=Date.now(); }

/* ---------- 元素 ---------- */
const $ = id => document.getElementById(id);
let cur=null, inReview=false, picked=new Set(), phase='ask', peeked=false;

$('total').textContent = WORDS.length;
const btns={};
POS.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='pos'; b.setAttribute('aria-pressed','false');
  b.innerHTML = `${p}.<span class="mark"></span><span class="key">${i+1}</span>`;
  b.onclick=()=>toggle(p);
  btns[p]=b; $('grid').appendChild(b);
});
function toggle(p){
  if(phase!=='ask') return;
  picked.has(p)?picked.delete(p):picked.add(p);
  btns[p].setAttribute('aria-pressed', picked.has(p));
  $('act').disabled = picked.size===0;
}

/* ---------- 出题 ---------- */
function nextWord(){
  let w;
  if(rq.length){
    inReview=true; w=rq.shift();
  }else{
    inReview=false;
    do{ refill(); w=S.queue.shift(); }while(w!==undefined && idx[w]===undefined);
  }
  cur=WORDS[idx[w]];
  paint();
}

function paint(){
  phase='ask'; peeked=false; picked.clear();
  POS.forEach(p=>{
    const b=btns[p]; b.className='pos';
    b.setAttribute('aria-pressed','false');
    b.querySelector('.mark').textContent='';
  });
  $('panel').className='panel off';
  $('act').textContent='提交'; $('act').className='act'; $('act').disabled=true;
  $('reveal').className='mini';
  $('word').textContent=cur.w;
  $('mode').className = inReview ? 'mode' : 'mode hide';
  $('mode').textContent = inReview ? `复习中 · 第${(S.srs[cur.w]?.st||0)+1}次` : '';
  stats();
}
function stats(){
  const left = rq.length + (inReview?1:0);      // 算上屏幕上这个
  $('due').textContent = left;
  $('due').parentNode.className = 'due' + (left?'':' zero');
  $('nest').textContent = Object.keys(S.nest).length;
  $('seen').textContent = seenCount();
}

/* ---------- 揭示 ---------- */
function reveal(){
  if($('panel').classList.contains('on')) return;
  $('panel').className='panel on';
  $('ptags').textContent = cur.p.map(p=>p+'.').join('  ');
  $('pcn').textContent = cur.cn;
  $('reveal').className='mini on';
  if(phase==='ask'){
    peeked=true;                       // 答题前偷看 → 不算数
    if(!inReview) markPool(cur.w);
  }
}
function markPool(w){ if(!S.pool.includes(w)) S.pool.push(w); save(); }

/* ---------- 判定 ---------- */
function submit(){
  const w=cur.w, ans=new Set(cur.p);
  const ok = ans.size===picked.size && [...ans].every(p=>picked.has(p));
  S.meta[w]=Date.now(); tickRound();

  // 1) 复习裁决：只在复习场，且今天只裁一次
  if(inReview && S.srs[w] && !judged.has(w)){
    judged.add(w);
    const rec=S.srs[w];
    if(!ok)            S.srs[w]={st:0, due:bj(1)};              // 打回第1站，重走 1-3-7
    else if(peeked)    S.srs[w]={st:rec.st, due:bj(1)};          // 偷看 → 不给学分，原站明天再来
    else if(rec.st>=2) delete S.srs[w];                          // 过第3站 → 毕业
    else               S.srs[w]={st:rec.st+1, due:bj(GAP[rec.st])};
  }

  // 2) 今日池：只收日常场答错的（偷看的已在 reveal 里收过）
  if(!inReview && !ok) markPool(w);

  // 3) 纠缠重练：只对真答错生效
  const put = inReview ? insertR : insertQ;
  if(!ok){
    const st=S.nest[w]||{strikes:0,streak:0};
    st.strikes++; st.streak=0; S.nest[w]=st;
    put(w, st.strikes===1?rnd(3,5):st.strikes===2?rnd(2,3):rnd(1,2));
    save(); showAnswer(); return;
  }
  const st=S.nest[w];
  if(st){
    if(peeked){ put(w, rnd(5,8)); }              // 偷看不给连对学分，但继续循环
    else { st.streak++; if(st.streak>=2) delete S.nest[w]; else put(w, rnd(5,8)); }
  }
  save(); nextWord();
}

function showAnswer(){
  phase='shown';
  const ans=new Set(cur.p);
  POS.forEach(p=>{
    const b=btns[p], m=b.querySelector('.mark');
    b.setAttribute('aria-pressed','false');
    if(ans.has(p)&&picked.has(p)){ b.className='pos hit'; m.textContent='✓'; }
    else if(ans.has(p)){ b.className='pos miss'; m.textContent='漏'; }
    else if(picked.has(p)){ b.className='pos bad'; m.textContent='✕'; }
    else { b.className='pos off'; m.textContent=''; }
  });
  reveal();
  $('act').textContent='下一个'; $('act').className='act next'; $('act').disabled=false;
  stats();
}

$('act').onclick = () => phase==='ask' ? submit() : nextWord();
$('reveal').onclick = reveal;

/* ---------- 今天到此为止 ---------- */
let armed=null;
$('finish').onclick = () => {
  const b=$('finish');
  if(!armed){
    b.className='mini armed'; b.textContent='再点一次确认';
    armed=setTimeout(()=>{ armed=null; b.className='mini'; b.textContent='今天到此为止'; }, 3000);
    return;
  }
  clearTimeout(armed); armed=null;
  b.className='mini'; b.textContent='今天到此为止';
  const tm=bj(1); let n=0;
  for(const w of new Set(S.pool)){
    if(S.srs[w]) continue;                      // 已在复习计划里的不重复排
    S.srs[w]={st:0, due:tm}; n++;
  }
  S.pool=[]; S.poolDate=bj(); save();
  toast(n ? `${n} 个词已排入明天` : '今天没有要复习的词');
};

/* ---------- 同步 ---------- */
function toast(t){ $('note').textContent=t; setTimeout(()=>{ if($('note').textContent===t) $('note').textContent=''; },4000); }

// 词 → 序号，时间 → 分钟，再 gzip，最后 base64
const B64 = u => { let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode(...u.subarray(i,i+8192)); return btoa(s).replace(/=+$/,''); };
const UNB64 = s => { const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const gz = async u => new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
const ungz = async u => new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();

async function enc(){
  const meta={}, srs={}, nest={};
  for(const w in S.meta) if(idx[w]!==undefined) meta[idx[w]]=Math.round(S.meta[w]/6e4);
  for(const w in S.srs)  if(idx[w]!==undefined) srs[idx[w]]=[S.srs[w].st, S.srs[w].due];
  for(const w in S.nest) if(idx[w]!==undefined) nest[idx[w]]=[S.nest[w].strikes, S.nest[w].streak];
  const raw = JSON.stringify({v:2, t:Date.now(), n:WORDS.length, meta, srs, nest, r:S.round,
                              pool:S.pool.map(w=>idx[w]).filter(i=>i!==undefined), pd:S.poolDate});
  const bytes = new TextEncoder().encode(raw);
  if(typeof CompressionStream==='undefined') return 'R' + B64(bytes);      // 老浏览器兜底
  return 'Z' + B64(new Uint8Array(await gz(bytes)));
}

async function dec(s){
  s = s.trim().replace(/\s+/g,'');
  let d;
  try{
    const tag = s[0], body = s.slice(1);
    let bytes = UNB64(body);
    if(tag==='Z') bytes = new Uint8Array(await ungz(bytes));
    else if(tag!=='R') throw 0;
    d = JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ throw new Error('这段不是同步码，检查是不是复制全了'); }
  if(d.v!==2 || !d.meta || !d.srs) throw new Error('这段不是同步码');
  if(d.n !== WORDS.length) throw new Error('两台的词库版本不一样，先把两边都更新到最新版');
  return d;
}

// 合并：逐词取更新的那一份，复习计划取更靠前的一站
function merge(d){
  let touched=0, adv=0;
  // 本轮起点取更早的那个：两台属于同一轮，早的那个才涵盖全部进度
  if(d.r && d.r < S.round) S.round = d.r;
  for(const i in d.meta){
    const w=WORDS[i] && WORDS[i].w; if(!w) continue;
    const t=d.meta[i]*6e4;
    if(!S.meta[w] || t>S.meta[w]){ S.meta[w]=t; touched++; }
  }
  for(const i in d.srs){
    const w=WORDS[i] && WORDS[i].w; if(!w) continue;
    const [st,due]=d.srs[i], mine=S.srs[w];
    if(!mine){ S.srs[w]={st,due}; adv++; }
    else if(st>mine.st || (st===mine.st && due>mine.due)){ S.srs[w]={st,due}; adv++; }
  }
  for(const i in (d.nest||{})){
    const w=WORDS[i] && WORDS[i].w; if(!w) continue;
    const [strikes,streak]=d.nest[i], mine=S.nest[w];
    if(!mine || strikes>mine.strikes) S.nest[w]={strikes,streak};
  }
  if(d.pd===bj()) for(const i of (d.pool||[])){
    const w=WORDS[i] && WORDS[i].w;
    if(w && !S.pool.includes(w)) S.pool.push(w);
  }
  if(seenCount()>=WORDS.length) S.round=Date.now();   // 合并后正好满一轮 → 开新轮
  save(); judged.clear(); buildRQ(); nextWord();
  return {touched, adv};
}

const fmtAge = t => {
  const m=Math.round((Date.now()-t)/6e4);
  if(m<2) return '刚刚';
  if(m<60) return m+' 分钟前';
  if(m<1440) return Math.round(m/60)+' 小时前';
  return Math.round(m/1440)+' 天前';
};
function lastTouch(){ let m=0; for(const w in S.meta) if(S.meta[w]>m) m=S.meta[w]; return m; }

$('sync').onclick = async () => {
  $('out').value='生成中…';
  $('sheet').classList.add('on');
  $('out').value = await enc();
  const lt=lastTouch();
  $('mystat').textContent = `这台：${Object.keys(S.meta).length} 个词有记录 · ${Object.keys(S.srs).length} 个在复习计划里 · 最后一次刷词 ${lt?fmtAge(lt):'无'}`;
  $('in').value=''; $('warn').textContent='';
  $('merge').dataset.ok=''; $('merge').textContent='合并';
};
$('close').onclick = () => $('sheet').classList.remove('on');
$('sheet').onclick = e => { if(e.target===$('sheet')) $('sheet').classList.remove('on'); };

$('copy').onclick = () => {
  const t=$('out');
  t.select(); t.setSelectionRange(0, 999999);
  const done = () => { $('copy').textContent='已复制'; setTimeout(()=>$('copy').textContent='复制同步码',2000); };
  if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, ()=>{ document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
};

$('merge').onclick = async () => {
  const v=$('in').value.trim();
  if(!v){ $('warn').textContent='先粘贴同步码'; return; }
  let d;
  try{ d=await dec(v); }catch(e){ $('warn').textContent=e.message; return; }
  const mine=lastTouch();
  if(d.t < mine - 6e4){
    // 防呆：对面比这台旧
    if($('merge').dataset.ok!=='1'){
      $('merge').dataset.ok='1';
      $('merge').textContent='仍要合并';
      $('warn').textContent=`这段码是 ${fmtAge(d.t)}生成的，比这台的进度旧。合并不会删东西，但可能没有新内容。再点一次继续。`;
      return;
    }
  }
  $('merge').dataset.ok=''; $('merge').textContent='合并';
  const r=merge(d);
  $('warn').textContent='';
  $('sheet').classList.remove('on');
  toast(r.touched||r.adv ? `已合并：${r.touched} 个词更新，${r.adv} 个复习计划推进`
                         : '合并完成，这段码里没有新内容');
};

$('exp').onclick = () => {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download=`词性备份-${bj()}.json`; a.click();
  toast('备份已下载');
};

/* ---------- 发音 ---------- */
let voice=null;
function pickVoice(){
  let v=[]; try{ v=speechSynthesis.getVoices()||[]; }catch(e){}
  const en=v.filter(x=>/^en(-|_|$)/i.test(x.lang));
  voice = en.find(x=>x.localService&&/US/i.test(x.lang)) || en.find(x=>x.localService) || en[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(cur.w);
    u.lang = voice?voice.lang:'en-US'; if(voice) u.voice=voice; u.rate=.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
$('say').onclick = speak;

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='4'){ e.preventDefault(); toggle(POS[+k-1]); return; }
  if(k==='enter'||k===' '){ e.preventDefault(); if(phase==='ask'){ if(picked.size) submit(); } else nextWord(); return; }
  if(k==='r'){ e.preventDefault(); reveal(); return; }
  if(k==='s'){ e.preventDefault(); speak(); return; }
});

/* ---------- go ---------- */
nextWord();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
