<title>词性</title>
<style>
:root{
  --bg:#12191c; --surface:#1d272b; --line:#2b393f;
  --text:#eceff0; --dim:#7b8b91;
  --pick:#d9a441; --pick-ink:#12191c;
  --right:#4fa8a0; --wrong:#c9605a;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#e7ebe8; --surface:#f6f8f6; --line:#ccd4d0;
    --text:#16201f; --dim:#6d7b78;
    --pick:#9a6b12; --pick-ink:#fdfaf3;
    --right:#1f6f68; --wrong:#a63f39;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}
#app{
  height:100dvh; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);
  max-width:560px; margin:0 auto;
}

/* ---- status ---- */
.status{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.status b{color:var(--pick);font-weight:600}

/* ---- word ---- */
.stage{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; min-height:0;
}
.word{
  font-family:ui-serif,"New York",Georgia,serif;
  font-size:clamp(2rem,12vw,3.6rem); font-weight:400;
  letter-spacing:-.02em; line-height:1.05; text-align:center;
  word-break:break-word; padding:0 4px;
}
.say{
  width:56px;height:56px;border-radius:50%;
  border:1px solid var(--line); background:var(--surface);
  color:var(--dim); font-size:20px; line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:none; flex:none;
}
.say:active{background:var(--line)}
.say.dead{color:var(--wrong);border-color:var(--wrong);font-size:11px;letter-spacing:.04em}

/* ---- choices ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.pos{
  position:relative;
  min-height:74px; border-radius:13px;
  border:1.5px solid var(--line); background:var(--surface);
  color:var(--text);
  font-family:ui-serif,"New York",Georgia,serif;
  font-style:italic; font-size:1.7rem; letter-spacing:.01em;
}
.pos:active{background:var(--line)}
.pos[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
/* review states */
.pos.hit{background:var(--right);border-color:var(--right);color:var(--pick-ink)}
.pos.miss{background:transparent;border-color:var(--right);border-style:dashed;color:var(--right)}
.pos.bad{background:transparent;border-color:var(--wrong);color:var(--wrong);text-decoration:line-through;text-decoration-thickness:1.5px}
.pos.off{opacity:.32}
.mark{
  position:absolute; top:7px; right:10px;
  font-family:-apple-system,system-ui,sans-serif; font-style:normal;
  font-size:10px; font-weight:600; letter-spacing:.1em;
}

/* ---- action ---- */
.act{
  width:100%; min-height:60px; border-radius:13px; border:none;
  background:var(--text); color:var(--bg);
  font-size:1.05rem; font-weight:600; letter-spacing:.16em;
}
.act:disabled{background:var(--surface);color:var(--dim);border:1.5px solid var(--line)}
.act.next{background:var(--wrong);color:#fff}

/* ---- foot ---- */
.foot{
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--dim);margin-top:9px;letter-spacing:.05em;
}
.foot span{opacity:.7}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
</style>
</head>
<body>
<div id="app">
  <div class="status">
    <div>纠缠 <b id="nest">0</b></div>
    <div>本轮 <b id="seen">0</b>/<span id="total">0</span></div>
  </div>

  <div class="stage">
    <div class="word" id="word">…</div>
    <button class="say" id="say" aria-label="发音">🔊</button>
  </div>

  <div class="grid" id="grid"></div>
  <button class="act" id="act" disabled>提交</button>

  <div class="foot">
    <span id="diag">—</span>
    <span id="reset" style="text-decoration:underline">重置</span>
  </div>
</div>

  const raw = localStorage.getItem(KEY);
  if(raw) S = Object.assign(S, JSON.parse(raw));
}catch(e){}
if(!S.round) S.round = Date.now();

const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const idx = {}; WORDS.forEach((x,i)=> idx[x.w]=i);
const lastOf = w => (S.meta[w] && S.meta[w][0]) || 0;

/* ---------- queue ---------- */
function refill(){
  if(S.queue.length >= 20) return;
  const inQ = new Set(S.queue);
  const pool = WORDS.filter(x => !inQ.has(x.w));
  if(!pool.length) return;
  // 没见过的词绝对优先(本轮全覆盖);全见过之后,从最久没见的一小撮里随机抽
  let head = pool.filter(x => !lastOf(x.w));
  if(!head.length){
    pool.sort((a,b) => lastOf(a.w) - lastOf(b.w));
    head = pool.slice(0, Math.max(40, Math.ceil(pool.length/12)));
  }
  for(let i=head.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[head[i],head[j]]=[head[j],head[i]];}
  for(const x of head){ if(S.queue.length>=20) break; S.queue.push(x.w); }
}
const insert = (w, gap) => S.queue.splice(Math.min(gap, S.queue.length), 0, w);
const rnd = (a,b) => a + ((Math.random()*(b-a+1))|0);

/* ---------- round counter ---------- */
function seenCount(){
  let n=0; for(const w in S.meta) if(S.meta[w][0] >= S.round) n++;
  return n;
}
function tickRound(){
  if(seenCount() >= WORDS.length) S.round = Date.now();
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
let cur=null, picked=new Set(), reviewing=false;

$('total').textContent = WORDS.length;
const btns = {};
POS.forEach(p => {
  const b = document.createElement('button');
  b.className='pos'; b.setAttribute('aria-pressed','false');
  b.innerHTML = `${p}.<span class="mark"></span>`;
  b.onclick = () => {
    if(reviewing) return;
    picked.has(p) ? picked.delete(p) : picked.add(p);
    b.setAttribute('aria-pressed', picked.has(p));
    $('act').disabled = picked.size===0;
  };
  btns[p]=b; $('grid').appendChild(b);
});

function paint(){
  reviewing=false; picked.clear();
  POS.forEach(p=>{
    const b=btns[p];
    b.className='pos'; b.setAttribute('aria-pressed','false');
    b.querySelector('.mark').textContent='';
  });
  $('act').textContent='提交'; $('act').className='act'; $('act').disabled=true;
  $('word').textContent = cur.w;
  $('nest').textContent = Object.keys(S.nest).length;
  $('seen').textContent = seenCount();
  sayReady();
}

function nextWord(){
  let w;
  do{ refill(); w = S.queue.shift(); }while(w !== undefined && idx[w] === undefined);
  cur = WORDS[idx[w]];
  paint();
}

/* ---------- answer ---------- */
function submit(){
  const ans = new Set(cur.p);
  const ok = ans.size===picked.size && [...ans].every(p=>picked.has(p));

  S.meta[cur.w] = [Date.now(), (S.meta[cur.w]||[0,0])[1] + (ok?0:1)];
  tickRound();

  if(ok){
    const st = S.nest[cur.w];
    if(st){
      st.streak++;
      if(st.streak>=2) delete S.nest[cur.w];
      else insert(cur.w, rnd(5,8));
    }
    save(); nextWord(); return;   // 立刻跳,零反馈
  }

  const st = S.nest[cur.w] || {strikes:0, streak:0};
  st.strikes++; st.streak=0; S.nest[cur.w]=st;
  const gap = st.strikes===1 ? rnd(3,5) : st.strikes===2 ? rnd(2,3) : rnd(1,2);
  insert(cur.w, gap);
  save(); review(ans);
}

function review(ans){
  reviewing=true;
  POS.forEach(p=>{
    const b=btns[p], m=b.querySelector('.mark');
    b.setAttribute('aria-pressed','false');
    if(ans.has(p) && picked.has(p)){ b.className='pos hit'; m.textContent='✓'; }
    else if(ans.has(p)){ b.className='pos miss'; m.textContent='漏'; }
    else if(picked.has(p)){ b.className='pos bad'; m.textContent='✕'; }
    else { b.className='pos off'; m.textContent=''; }
  });
  $('act').textContent='下一个'; $('act').className='act next'; $('act').disabled=false;
  $('nest').textContent = Object.keys(S.nest).length;
}

$('act').onclick = () => reviewing ? nextWord() : submit();

/* ---------- speech ---------- */
let voice=null, dead=false;
function pickVoice(){
  let v=[]; try{ v = speechSynthesis.getVoices()||[]; }catch(e){}
  const en = v.filter(x=>/^en(-|_|$)/i.test(x.lang));
  voice = en.find(x=>x.localService && /US/i.test(x.lang)) || en.find(x=>x.localService) || en[0] || null;
  $('diag').textContent = `voices ${v.length} · en ${en.length} · ${voice? voice.name.slice(0,18):'none'}`;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}else{
  dead=true; $('diag').textContent='no speechSynthesis';
}
function sayReady(){
  const b=$('say');
  b.className = dead ? 'say dead' : 'say';
  b.textContent = dead ? '无语音' : '🔊';
}
$('say').onclick = () => {
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cur.w);
    u.lang = voice ? voice.lang : 'en-US';
    if(voice) u.voice = voice;
    u.rate = 0.9;
    u.onerror = e => { $('diag').textContent = 'speak error: ' + (e.error||'?'); };
    if(!voice) pickVoice();
    speechSynthesis.speak(u);
  }catch(e){ $('diag').textContent = 'speak throw: ' + e.message; }
};

/* ---------- reset ---------- */
$('reset').onclick = () => {
  if(!confirm('清空全部进度,从头开始?')) return;
  localStorage.removeItem(KEY);
  S = { meta:{}, queue:[], nest:{}, round:Date.now() };
  nextWord();
};

/* ---------- go ---------- */
nextWord();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
